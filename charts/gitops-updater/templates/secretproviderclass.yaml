{{- if .Values.azure }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gitops-updater-secretproviderclass
  namespace: "{{ .Release.Namespace }}"
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.azure.clientId | quote }}
    keyvaultName: {{ .Values.azure.keyvaultName | quote }}
    cloudName: AzurePublicCloud
    tenantId: {{ .Values.azure.tenantId | quote }}
    {{- with .Values.azure.resourceGroup }}
    resourceGroup: {{ . | quote }}
    {{- end }}
    {{- with .Values.azure.subscriptionId }}
    subscriptionId: {{ . | quote }}
    {{- end }}
    objects: |
      array:
       {{- range .Values.azure.secrets }}
        - |
          objectName: {{ . }}
          objectType: secret
       {{- end }}
{{- end }}
