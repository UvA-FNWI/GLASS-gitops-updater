apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-updater
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    matchLabels:
      app: gitops-updater
  replicas: 1
  template:
    metadata:
      annotations:
        gitops-updater/release: "{{ .Chart.AppVersion }}"
      labels:
        app: gitops-updater
      {{- if .Values.azure }}
        azure.workload.identity/use: "true"
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- if .Values.azure }}
      serviceAccountName: gitops-updater-sa
      {{- end }}
      {{- with (include "gitops-updater.imagePullSecretName" .) }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: gitops-updater
          image: "{{ .Values.image }}:{{ .Values.tag | default .Chart.AppVersion }}"
          imagePullPolicy: Always
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8080
          env:
            - name: GITOPS_UPDATER_VERSION
              value: "{{ .Chart.AppVersion }}"
            - name: CONFIG_PATH
              value: "/mnt/config/config.yaml"
          {{- with (include "gitops-updater.secretName" .) }}
          envFrom:
            - secretRef:
                name: {{ . }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /mnt/config
            - name: tmp
              mountPath: /tmp
          {{- if .Values.azure }}
            - name: secrets-store-inline
              mountPath: {{ .Values.azure.mountPath }}
              readOnly: true
          {{- end }}

      volumes:
        - name: config-volume
          configMap:
            name: gitops-updater-configmap
        - name: tmp
          emptyDir:
            sizeLimit: 50Mi
      {{- if .Values.azure }}
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "gitops-updater-secretproviderclass"
      {{- end }}
