hostname: "gitops-updater.local"
ingressClass: "nginx"
image: gitops-updater
# Empty tag uses Chart.AppVersion, which CI sets to VERSION when packaging the chart.
tag: ""
# Empty leaves TLS to the ingress controller default certificate.
# Set a ClusterIssuer name when cert-manager should issue gitops-updater-cert.
clusterIssuer: ""

config:
  - name: example-name
    path: directory/manifest.yaml
    secretPath: /mnt/secrets/gitops-updater-secret
    handler: argocd
    provider: my-github-repo

providers:
  - name: my-github-repo
    repository: example/repo
    branch: main
    type: GitHub
    tokenPath: /mnt/secrets/gitops-updater-github-token
  - name: my-gitlab-repo
    project: example/project
    url: https://gitlab.com
    branch: main
    type: GitLab
    tokenPath: gitlab_token

externalSecrets:
  enabled: false
  secretStoreRef:
    name: hashicorp-vault
    kind: ClusterSecretStore