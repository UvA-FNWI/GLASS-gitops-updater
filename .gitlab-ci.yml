stages:
  - build
  - release

build-containers:
  stage: build
  script:
    - set -euo pipefail
    - export VERSION=$(date "+1.0.%Y%m%d%H%M%S")
    - echo "VERSION=${VERSION}" > version.env
    - docker build -t "${CR_NAME}/gitops-updater:${VERSION}" -f Dockerfile .
    - docker push "${CR_NAME}/gitops-updater:${VERSION}"
  artifacts:
    reports:
      dotenv: version.env

build-charts:
  stage: release
  script:
    - set -euo pipefail
    - helm package --version "${VERSION}" --app-version "${VERSION}" charts/gitops-updater
    - helm push "gitops-updater-${VERSION}.tgz" ${HELM_REPO}
