[project]
name = "gitops-updater"
version = "1.0.0"
description = "HTTP API for updating YAML files in a Git repository for GitOps workflows"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "flask",
    "gunicorn",
    "pygithub",
    "python-gitlab",
    "ruamel.yaml",
    "semver",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "jsonschema>=4.26.0",
]
release = [
    "jsonschema>=4.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
