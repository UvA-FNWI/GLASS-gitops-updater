# Image and chart are pushed to every registry before any rollout.
# Each rollout waits on a GitHub Environment of the same name, with its own
# required reviewer. The jobs do not depend on each other, so either can go first.
#
# datanosecr is the registry for the current clusters. Add another registries
# entry when a new cluster pulls its image and chart from somewhere else.

registries:
  - name: datanose
    host: datanosecr.azurecr.io

rollout:
  - name: datanose
    registry: datanose
    url: https://api-v2-tst.datanose.nl/gitops-updater
    config: gitops-updater
    secret: UPDATER_SECRET_DN
  - name: k8s
    registry: datanose
    url: https://k8s.datanose.nl/gitops-updater
    config: gitops-updater
    secret: UPDATER_SECRET_K8S
