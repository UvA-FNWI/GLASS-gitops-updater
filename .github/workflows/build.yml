name: build and push app

on:
  push:
    branches: [ "main" ]

env:
  CR_NAME: datanosecr.azurecr.io

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Build container
      run: |
        docker build -t "${{ env.CR_NAME }}/gitops-updater:latest" .
        docker push "${{ env.CR_NAME }}/gitops-updater:latest"

    - name: Build chart and release
      env:
        UPDATER_SECRET: ${{ secrets.UPDATER_SECRET_DN }}
      run: |
        set -euo pipefail
        echo "::add-mask::${UPDATER_SECRET}"
        export VERSION=$(date "+1.0.%Y%m%d%H%M%S")
        helm package --version "${VERSION}" --app-version "${VERSION}" charts/gitops-updater
        helm push "gitops-updater-${VERSION}.tgz" oci://${{ env.CR_NAME }}/helm
        
        # TODO: switch to Authorization Bearer after Bearer-capable image is live on tst (see PR 2 rollout).
        curl -fsS \
          "https://api-v2-tst.datanose.nl/gitops-updater?name=gitops-updater&secret=${UPDATER_SECRET}&version=${VERSION}"
