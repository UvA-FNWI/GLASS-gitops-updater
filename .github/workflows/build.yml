name: build and push app

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      registries: ${{ steps.targets.outputs.registries }}
      rollouts: ${{ steps.targets.outputs.rollouts }}
      hosts: ${{ steps.targets.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read release targets
        id: targets
        run: python3 scripts/release_targets.py plan .github/release-targets.yaml

  publish:
    needs: plan
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set release version
        id: version
        run: echo "version=$(date '+1.0.%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Build image and chart, push to every registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOSTS: ${{ needs.plan.outputs.hosts }}
        run: |
          set -euo pipefail
          docker build -t "gitops-updater:${VERSION}" .
          helm package --version "${VERSION}" --app-version "${VERSION}" charts/gitops-updater
          while IFS= read -r host; do
            [ -n "${host}" ] || continue
            docker tag "gitops-updater:${VERSION}" "${host}/gitops-updater:${VERSION}"
            docker push "${host}/gitops-updater:${VERSION}"
            helm push "gitops-updater-${VERSION}.tgz" "oci://${host}/helm"
          done <<< "${HOSTS}"

  rollout:
    needs: [plan, publish]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.plan.outputs.rollouts) }}
    environment: ${{ matrix.target.name }}
    steps:
      - name: Roll out ${{ matrix.target.name }}
        env:
          UPDATER_SECRET: ${{ secrets[matrix.target.secret] }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATER_SECRET}" ]; then
            echo "missing GitHub secret ${{ matrix.target.secret }}" >&2
            exit 1
          fi
          echo "::add-mask::${UPDATER_SECRET}"
          curl -fsS \
            -H "Authorization: Bearer ${UPDATER_SECRET}" \
            "${{ matrix.target.url }}?name=${{ matrix.target.config }}&version=${VERSION}"
