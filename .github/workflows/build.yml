name: build and push app

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      rollouts: ${{ steps.targets.outputs.rollouts }}
      hosts: ${{ steps.targets.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Read release targets
        id: targets
        env:
          RELEASE_HOSTS: ${{ vars.RELEASE_HOSTS }}
          ROLLOUT_ENVIRONMENTS: ${{ vars.ROLLOUT_ENVIRONMENTS }}
        run: python scripts/release_targets.py

  publish:
    needs: plan
    runs-on: self-hosted
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set release version
        id: version
        run: echo "version=$(date '+1.0.%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Build image and chart, push to every registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOSTS: ${{ needs.plan.outputs.hosts }}
        run: |
          set -euo pipefail
          docker build -t "gitops-updater:${VERSION}" .
          helm package --version "${VERSION}" --app-version "${VERSION}" charts/gitops-updater
          while IFS= read -r host; do
            [ -n "${host}" ] || continue
            docker tag "gitops-updater:${VERSION}" "${host}/gitops-updater:${VERSION}"
            docker push "${host}/gitops-updater:${VERSION}"
            helm push "gitops-updater-${VERSION}.tgz" "oci://${host}/helm"
          done <<< "${HOSTS}"

  rollout:
    needs: [plan, publish]
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.plan.outputs.rollouts) }}
    environment: ${{ matrix.environment }}
    steps:
      - name: Roll out ${{ matrix.environment }}
        env:
          UPDATER_SECRET: ${{ secrets[vars.UPDATER_SECRET_NAME] }}
          UPDATER_URL: ${{ vars.UPDATER_URL }}
          UPDATER_CONFIG: ${{ vars.UPDATER_CONFIG }}
          UPDATER_SECRET_NAME: ${{ vars.UPDATER_SECRET_NAME }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${UPDATER_URL}" ] || [ -z "${UPDATER_CONFIG}" ] || [ -z "${UPDATER_SECRET_NAME}" ]; then
            echo "environment ${{ matrix.environment }} is missing UPDATER_URL, UPDATER_CONFIG, or UPDATER_SECRET_NAME" >&2
            exit 1
          fi
          if [ -z "${UPDATER_SECRET}" ]; then
            echo "missing GitHub secret ${UPDATER_SECRET_NAME}" >&2
            exit 1
          fi
          echo "::add-mask::${UPDATER_SECRET}"
          # Bearer replaces the query secret once the image from this branch is serving.
          curl -fsS \
            "${UPDATER_URL}?name=${UPDATER_CONFIG}&secret=${UPDATER_SECRET}&version=${VERSION}"
