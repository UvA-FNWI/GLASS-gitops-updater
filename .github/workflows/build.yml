name: build and push app

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CR_NAME: datanosecr.azurecr.io

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set release version
      run: echo "VERSION=$(date '+1.0.%Y%m%d%H%M%S')" >> "$GITHUB_ENV"

    - name: Build container
      run: |
        set -euo pipefail
        docker build -t "${{ env.CR_NAME }}/gitops-updater:${VERSION}" .
        docker push "${{ env.CR_NAME }}/gitops-updater:${VERSION}"

    - name: Build chart and release
      env:
        UPDATER_SECRET: ${{ secrets.UPDATER_SECRET_DN }}
      run: |
        set -euo pipefail
        echo "::add-mask::${UPDATER_SECRET}"
        helm package --version "${VERSION}" --app-version "${VERSION}" charts/gitops-updater
        helm push "gitops-updater-${VERSION}.tgz" oci://${{ env.CR_NAME }}/helm

        curl -fsS \
          -H "Authorization: Bearer ${UPDATER_SECRET}" \
          "https://api-v2-tst.datanose.nl/gitops-updater?name=gitops-updater&version=${VERSION}"
